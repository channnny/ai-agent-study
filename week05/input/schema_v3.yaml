# adiga 입결·평가기준 수집 스키마 v3
# 분석 기반: 8개 대학 (가천대·서울대·제주대·연세대·고려대·부산대·경북대·남서울대)
# updated: 2026-05-18
#
# v2 대비 주요 변경:
# - 전형구분을 enum 단일 → "대분류 + 소분류 + 원본전형명" 3컬럼으로 분리
# - 평가요소를 정규화된 3슬롯 + 표기방식 컬럼으로 통일
# - 캠퍼스, 데이터 공개수준 등 신규 컬럼 추가
# - "PK 보강 키" (대학·전형·모집단위 + 캠퍼스 + 군) 도입

version: 3
primary_key:
  required: [대학, 전형명_원본, 모집단위]
  optional_disambiguator: [캠퍼스, 군]   # 동일 PK 충돌 방지용
sheet_join_key: [대학, 전형명_원본, 모집단위, 캠퍼스, 군]

crawl_tabs: [공통, 학생부종합, 학생부교과, 수능위주]   # 사이트 4탭 (시트와 별개)

# ─────────────────────────────────────────────
# 공통 분류 코드 (정규화 도우미)
# ─────────────────────────────────────────────
classification_codes:

  전형구분_대분류:
    - 학생부위주(교과)
    - 학생부위주(종합)
    - 논술위주
    - 실기/실적위주
    - 수능위주
    - 기타

  전형구분_소분류_예시:               # 닫힌 집합 아님, 매핑 시 참고용
    학생부위주(종합): [일반전형, 활동우수형, 계열적합전형, 학업우수전형, 지역인재전형, 기회균형, 사회배려자, 고른기회, 다문화, 농어촌학생, 기초생활수급자, 특수교육대상자, 영농창업인재, SW특별, 모바일과학인재, 사이버국방, 특기자]
    학생부위주(교과): [학교추천, 지역인재, 추천형, 교과전형, 교과+면접전형]
    수능위주: [일반전형, 지역인재, 농어촌학생]
    실기/실적위주: [일반전형, 특기자]
    논술위주: [논술전형]

  평가표기방식:
    - 비율백분율          # 가천대 등 (40/40/20)
    - 등급제_7단계        # 서울대 등 (A+, A0, A-, B+, B0, B-, C)
    - 등급제_8단계        # 연세대 (A+, A0, A-, B+, B0, B-, C, F)
    - 점수제              # 제주대 (400/300/300)
    - 정성종합            # 경북대 등 (입학사정관 종합평가)
    - 혼합                # 단계별로 방식이 다름
    - 미명시

  면접유형:
    - 없음
    - 서류기반_확인
    - 제시문_논리사고
    - 인적성_면접
    - 단계별심층_2회
    - 실기포함

  수능최저유무:
    - 있음_전체
    - 있음_모집단위별
    - 없음

  수능_활용지표:                      # 정시
    - 표준점수
    - 백분위
    - 변환표준점수
    - 백분위_변환표준점수

  데이터공개수준:                      # 자동 판정용 메타
    - 표준양식_완전
    - 표준양식_부분
    - 비표준_텍스트만
    - 미공개

# ─────────────────────────────────────────────
# 시트별 컬럼 정의
# ─────────────────────────────────────────────
sheets:

  # ═════════════════════════════════════════
  # 1) 수시 입시결과 — 작년 양식 22컬럼 + 신규 6컬럼
  # ═════════════════════════════════════════
  susi_result:
    sheet_name_kr: "수시 입시결과"
    status: confirmed
    header_rows: 2
    column_groups:
      - { range: G:M, name: 대학별환산 }
      - { range: N:T, name: 학생부등급 }
    columns:
      # 기존 22컬럼 (작년 양식 유지)
      - { name: 대학,           type: string }
      - { name: 전형,           type: string,  desc: "전형명 원본" }
      - { name: 모집단위,       type: string }
      - { name: 모집인원,       type: integer }
      - { name: 경쟁률,         type: float   }
      - { name: 충원합격순위,   type: integer }
      - { group: 대학별환산, name: 최고,  type: float }
      - { group: 대학별환산, name: 평균,  type: float }
      - { group: 대학별환산, name: 50컷,  type: float }
      - { group: 대학별환산, name: 70컷,  type: float }
      - { group: 대학별환산, name: 80컷,  type: float }
      - { group: 대학별환산, name: 100컷, type: float }
      - { group: 대학별환산, name: 총점,  type: float }
      - { group: 학생부등급, name: 최고,  type: float }
      - { group: 학생부등급, name: 평균,  type: float }
      - { group: 학생부등급, name: 50컷,  type: float }
      - { group: 학생부등급, name: 70컷,  type: float }
      - { group: 학생부등급, name: 80컷,  type: float }
      - { group: 학생부등급, name: 90컷,  type: float }
      - { group: 학생부등급, name: 최저,  type: float }
      - { name: 기준,           type: string }
      - { name: 반영교과,       type: string }
      # 신규 컬럼 v3
      - { name: 캠퍼스,             type: string,  desc: "본교/상주/양산 등" }
      - { name: 전형구분_대분류,    type: enum,    ref: classification_codes.전형구분_대분류 }
      - { name: 전형구분_소분류,    type: string,  desc: "LLM 분류 또는 매핑 사전" }
      - { name: 결과학년도,         type: string,  desc: "평가-결과 학년도 불일치 대응" }
      - { name: 데이터공개수준,     type: enum,    ref: classification_codes.데이터공개수준 }
      - { name: raw_text,           type: string  }

  # ═════════════════════════════════════════
  # 2) 수시 평가기준
  # ═════════════════════════════════════════
  susi_eval:
    sheet_name_kr: "수시 평가기준"
    status: drafted_from_8_samples
    seed_columns:
      # PK
      - 대학
      - 전형                                    # 원본 전형명
      - 모집단위
      - 캠퍼스
      - 모집인원

      # 분류
      - 전형구분_대분류
      - 전형구분_소분류
      - 평가표기방식
      - 면접유형
      - 수능최저유무

      # 전형방법
      - 선발방법                                # 일괄합산 / 단계별
      - 1단계_배수                              # string (예: "3~5배수" 가능)
      - 1단계_요소비율                          # 예: "서류100" / "학생부교과90+서류10"
      - 2단계_요소비율                          # 예: "1단계60+면접40"

      # 평가요소 (정규화 3슬롯, 비어 있어도 OK)
      # 남서울대 사례: 2슬롯 (학업역량 없이 공동체+진로만)
      # 서울대 사례: 3슬롯 (학업역량·학업태도·학업외소양)
      # 연세대 사례: 2슬롯 (종합평가Ⅰ=학업+진로 / 종합평가Ⅱ=공동체)
      - 평가요소1_이름                          # 학업역량 / 종합평가Ⅰ / 인성리더십 등
      - 평가요소1_비중                          # 표기방식 따라 다른 단위
      - 평가요소2_이름                          # 진로역량 / 종합평가Ⅱ / 전공적합성 등
      - 평가요소2_비중
      - 평가요소3_이름                          # 공동체역량 / 학업외소양 (있을 때만)
      - 평가요소3_비중
      - 학업역량_정량반영여부                   # boolean - 남서울대처럼 교과 미반영 케이스
      - 평가요소_세부항목수                     # int - 남서울대 5, 보통 3

      # 수능최저
      - 수능최저_요건                           # 예: "국수영탐 중 2개 합 5등급, 한국사 4등급"
      - 수능최저_탐구반영                       # "1개 과목" / "2개 평균" / "2개 합"

      # 면접
      - 면접_평가위원수
      - 면접_시간
      - 면접_평가요소비율                       # 텍스트 그대로
      - 면접_문항사전공개여부                   # boolean - 남서울대 사례

      # 교과
      - 교과_학년별반영비율
      - 교과_반영영역_인문
      - 교과_반영영역_자연
      - 교과_반영영역_예체능
      - 교과_등급환산방식                       # 석차등급 / 변환등급 / 정성평가
      - 진로선택과목_반영여부

      # 메타
      - 데이터공개수준

    extension_columns:                          # 특정 대학에서만 등장 — 정규화 안 함
      - 핵심권장과목                            # 서울대급
      - 권장과목                                # 서울대급
      - 학폭감점기준                            # 제주대 등
      - 검정고시_비교내신_방식
      - 계약학과_조건                           # 모바일과학인재(삼성) 등
      - 신설전형여부

    fallback:
      - raw_text

  # ═════════════════════════════════════════
  # 3) 정시 입시결과
  # ═════════════════════════════════════════
  jeongsi_result:
    sheet_name_kr: "정시 입시결과"
    status: drafted_from_8_samples
    seed_columns:
      # PK
      - 대학
      - 전형
      - 모집단위
      - 캠퍼스
      - 군                                      # 가/나/다

      # 모집
      - 모집인원_최초
      - 모집인원_이월
      - 모집인원_최종
      - 경쟁률
      - 충원합격순위

      # 환산점수
      - 환산점수_총점
      - 환산점수_70컷
      - 환산점수_50컷
      - 환산점수_90컷

      # 백분위 (영역별)
      - 백분위_총점_70컷
      - 백분위_국어_70컷
      - 백분위_수학_70컷
      - 백분위_영어_70컷                        # 영어는 등급일 때도 있음 (혼합)
      - 백분위_탐구1_70컷
      - 백분위_탐구2_70컷
      - 백분위_한국사_70컷

      # 수학선택 응시비율
      - 수학선택_확률통계_비율
      - 수학선택_미적분_비율
      - 수학선택_기하_비율

      - 결과학년도
      - 데이터공개수준

    extension_columns:
      - 변환표준점수_70컷
      - 표준점수_70컷

    fallback:
      - raw_text

  # ═════════════════════════════════════════
  # 4) 정시 평가기준
  # ═════════════════════════════════════════
  jeongsi_eval:
    sheet_name_kr: "정시 평가기준"
    status: drafted_from_8_samples
    seed_columns:
      # PK
      - 대학
      - 전형
      - 모집단위
      - 캠퍼스
      - 군
      - 모집인원

      # 분류
      - 전형구분_대분류                         # 수능위주 / 실기위주
      - 전형구분_소분류
      - 선발방법                                # 일괄합산 / 단계별

      # 반영비율
      - 수능_반영비율
      - 실기_반영비율
      - 학생부_반영비율                         # 일부 대학 학생부 반영

      # 수능
      - 수능_활용지표                           # enum
      - 수능_필수응시영역                       # 예: "국,수,영,사/과탐,한국사" — 부산대처럼 모집단위별 분기
      - 수능_국어_비율
      - 수능_수학_비율
      - 수능_영어_비율                          # 또는 등급별배점표 필드 참조
      - 수능_탐구_비율
      - 수능_탐구_과목수                        # 1/2
      - 수능_한국사_반영방식                    # 필수/가산점/등급환산
      - 영어등급별_배점표                       # raw string

      # 가산점
      - 가산점_미적분_비율
      - 가산점_기하_비율
      - 가산점_과학탐구_비율
      - 가산점_조건                             # "과탐 2과목 응시자에 한해" 등

      - 데이터공개수준

    extension_columns:
      - 수능_응시영역_유형분기                  # 연세대 유형Ⅰ~Ⅳ, 서울대 유형①/②
      - 핵심권장과목
      - 권장과목

    fallback:
      - raw_text

# ─────────────────────────────────────────────
# 운영 메타
# ─────────────────────────────────────────────
output_workbooks:
  master: "adiga_{year}.xlsx"           # 4개 통합 시트 + error + summary + new_columns
  per_university: "per_university/{unvCd}.xlsx"

aux_sheets_in_master:
  - error_sheet                          # 3회 재시도 실패 대학
  - data_unavailable_sheet               # 평가기준/결과 페이지 자체 미공개
  - new_columns_proposals                # LLM이 raw_text에서 발견한 신규 컬럼 후보
  - summary                              # 충진율 등

crawl_strategy:
  http_client: "requests + BeautifulSoup"
  fallback: "Playwright (필요 시)"
  url_pattern: "https://www.adiga.kr/ucp/uvt/uni/univDetailSelection.do?menuId=PCUVTINF2000&unvCd={code}&searchSyr={year}"
  rate_limit:
    concurrent: 5
    delay_between_requests: 0.5

# ─────────────────────────────────────────────
# 충진율 예측 (8개 샘플 기반)
# ─────────────────────────────────────────────
expected_fill_rate:
  susi_result:
    PK_필수컬럼: 100%
    학생부등급_70컷: 80%
    대학별환산_총점: 30%                 # 가천대처럼 대학별환산 없는 곳 많음
  susi_eval:
    PK_필수컬럼: 95%                     # 남서울대급은 누락 가능
    평가요소_3슬롯: 70%                  # 연세대처럼 다른 구조 있음
    extension_columns: 5~20%
  jeongsi_result:
    PK_필수컬럼: 95%
    백분위_탐구1/2_70컷: 60%
  jeongsi_eval:
    PK_필수컬럼: 95%
    수능_필수응시영역: 80%
